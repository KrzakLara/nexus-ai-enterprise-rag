name: Quality checks
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      # Integration tests DROP and re-create this *_test database.
      TEST_DATABASE_URL: postgresql+psycopg://nexus:ci_only@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.7
      - name: Tesseract OCR (English + Croatian) for Phase 3 scanned-document tests and gates
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hrv
      - run: uv sync --locked --extra dev
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-intfloat-multilingual-e5-small-v1
      - run: uv run ruff check backend scripts
      - name: Tests (SQLite + PostgreSQL/pgvector + real embedding model)
        run: uv run pytest -q -rs --cov=backend/app --cov-report=term
      - name: Evaluation gates (frozen dataset, test split, real embeddings in PostgreSQL)
        # Fails on: malformed/stale ground truth, any authorization violation, invalid citations,
        # retrieval below eval/ci_thresholds.json, hybrid abstention below its floor.
        env:
          EVAL_DATABASE_URL: postgresql+psycopg://nexus:ci_only@localhost:5432/nexus_eval
        run: uv run python scripts/evaluate.py --ci
      - name: Upload CI evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-ci-report
          path: eval/reports/ci*.json*
      - name: Document-intelligence gates (frozen 32-document corpus, real OCR, PostgreSQL, security matrix)
        # Fails on: any authorization violation, any unprocessed document, validation false accepts,
        # a refused-stale-edit regression, or metrics below eval/docintel/ci_thresholds.json.
        run: uv run python scripts/evaluate_docintel.py --ci --database-url postgresql+psycopg://nexus:ci_only@localhost:5432/nexus_docintel_eval
      - name: Upload document-intelligence CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docintel-ci-report
          path: eval/docintel/reports/ci.json
      - name: Retrieval/ACL smoke evaluation on a migrated + seeded PostgreSQL database
        env:
          DATABASE_URL: postgresql+psycopg://nexus:ci_only@localhost:5432/nexus
          STORAGE_DIR: ./data/uploads
        run: |
          uv run python scripts/seed_demo.py
          uv run python scripts/embed_backfill.py
          uv run python scripts/evaluate_retrieval.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run build
