[project]
name = "nexus-enterprise-rag"
version = "0.3.0"
description = "Evidence-first enterprise document intelligence - runnable local demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.0,<3",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyJWT>=2.8,<3",
  "openai>=1.75,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "numpy>=1.26,<3",
  "torch>=2.4,<3",
  "sentence-transformers>=3.0,<6",
  # Phase 3 document intelligence: layout-aware PDF parsing (words, bounding boxes, tables),
  # page rendering for OCR, XLSX, and the Tesseract OCR binding (needs the tesseract binary).
  "pdfplumber>=0.11.4,<0.12",
  "pypdfium2>=4.30,<6",
  "pillow>=10.4,<14",
  "openpyxl>=3.1,<4",
  "pytesseract>=0.3.13,<0.4",
  # Phase 4 enterprise hardening.
  # OIDC: discovery / token / JWKS calls (httpx), RS/PS/ES signature verification (PyJWT crypto
  # extra) and AES-GCM encryption of refresh tokens at rest (cryptography).
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.8,<3",
  "cryptography>=43",
  # S3-compatible object storage (MinIO locally, AWS S3 or any S3 API in deployments)
  "boto3>=1.35,<2",
  # Observability: Prometheus metrics and OpenTelemetry traces (OTLP over HTTP/protobuf)
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
]

[project.optional-dependencies]
# reportlab: only scripts/build_docintel_dataset.py (renders the frozen Phase 3 corpus with embedded TTF fonts)
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "ruff>=0.8,<1", "reportlab>=4.2,<5"]
# (httpx is also a runtime dependency since Phase 4; it stays listed here for older tooling.)
# Phase 2d query-translation EXPERIMENT only (scripts/experiment_query_translation.py, local
# MarianMT). Not used by the API and not installed in the Docker image.
mt = ["sentencepiece>=0.2,<1"]

# CPU-only PyTorch: avoids multi-GB CUDA wheels on Linux CI and in Docker images.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
  "ocr: needs the Tesseract OCR binary (installed in the Docker image and in CI)",
  "model: loads the real SentenceTransformers embedding model (downloads ~470 MB on first run)",
  "postgres: requires a PostgreSQL + pgvector server via TEST_DATABASE_URL",
  "rls: PostgreSQL row-level-security tests (runtime roles nexus_app / nexus_worker)",
  "minio: needs an S3-compatible server via TEST_S3_ENDPOINT_URL (MinIO in Docker / CI)",
  "keycloak: needs a running Keycloak with the nexus realm via TEST_KEYCLOAK_URL",
]

[tool.ruff]
line-length = 100
extend-exclude = ["backend/migrations/versions"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff.lint]
# Pinned explicitly: ruff 0.17 widened its default rule set, which silently broke CI.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"] # Standalone scripts intentionally adjust sys.path before project imports.
