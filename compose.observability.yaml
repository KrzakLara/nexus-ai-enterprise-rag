# Overlay: local observability stack (optional; the base stack runs without it).
#
#   docker compose -f compose.yaml -f compose.observability.yaml up --build
#     Grafana     http://localhost:3001   (dashboard "NEXUS AI — Operations"; local-only admin below)
#     Prometheus  http://localhost:9090
#     Jaeger UI   http://localhost:16686  (traces: nexus-api -> queue -> nexus-worker)
#
# Prometheus scrapes the internal metrics ports (api:9100, every worker replica:9100); the OTLP
# receiver (jaeger:4318) is reachable only inside the Compose network.

x-otel-env: &otel-env
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_SAMPLER_RATIO: "1.0"

services:
  api:
    environment:
      <<: *otel-env

  worker:
    environment:
      <<: *otel-env

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    deploy:
      resources:
        limits: {memory: 768m}

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    deploy:
      resources:
        limits: {memory: 768m}

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-grafana-local-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-local-admin-secret}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nexus-operations.json
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"   # 3001: 3000 is often taken by other local tools
    depends_on:
      - prometheus
    deploy:
      resources:
        limits: {memory: 512m}

volumes:
  prometheus_data:
  grafana_data:
