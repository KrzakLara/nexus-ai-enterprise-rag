# Local Prometheus for NEXUS AI (compose.observability.yaml). Internal network only.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nexus-api
    static_configs:
      - targets: ["api:9100"]
  - job_name: nexus-worker
    # every replica of `docker compose up --scale worker=N`
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
