# LOCAL DEMO ONLY. Do not expose these services to public networks.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: demo_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://nexus:demo_local_only@db:5432/nexus
      STORAGE_DIR: /app/data/uploads
      JWT_SECRET: ${JWT_SECRET:-nexus-local-demo-rotate-this-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      EMBEDDING_DEVICE: cpu
    volumes:
      - document_storage:/app/data
      - model_cache:/models  # Hugging Face cache: the ~470 MB model downloads only once
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  document_storage:
  model_cache:
